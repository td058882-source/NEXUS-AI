<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS AI</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080b14;color:#eef2ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#24366c 0,transparent 55%),#080b14}
main{max-width:900px;margin:auto;padding:32px 18px;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#20c8d8);display:grid;place-items:center;font-weight:900;color:white}
h1{font-size:22px;margin:0;letter-spacing:2px}header p{margin:3px 0;color:#99a6c8;font-size:12px}
#status{margin-left:auto;font-size:12px;color:#9ba8c9}
.welcome{text-align:center;margin:10vh 0 30px}.welcome h2{font-size:clamp(28px,6vw,46px);margin:0 0 12px}.gradient{background:linear-gradient(90deg,#a78bfa,#5eead4);color:transparent;background-clip:text}.welcome p{color:#a6b1ce}
#messages{display:flex;flex-direction:column;gap:14px;flex:1;padding-bottom:20px}.msg{max-width:85%;padding:14px 16px;border:1px solid #27304a;border-radius:18px;white-space:pre-wrap;line-height:1.5}.user{align-self:flex-end;background:#28234b}.assistant{align-self:flex-start;background:#111827}
form{position:sticky;bottom:12px;display:flex;gap:10px;padding:10px;background:#111827;border:1px solid #303a58;border-radius:18px}textarea{flex:1;resize:none;max-height:160px;min-height:44px;background:transparent;border:0;color:white;padding:12px;outline:none;font:inherit}button{border:0;border-radius:12px;background:linear-gradient(135deg,#785cff,#16b8c8);color:white;font-weight:700;padding:0 22px;cursor:pointer}button:disabled{opacity:.5}
.note{font-size:12px;color:#8290b3;text-align:center;margin:12px}
</style></head>
<body><main>
<header><div class="logo">N</div><div><h1>NEXUS AI</h1><p>UNA IA. MUCHAS POSIBILIDADES.</p></div><span id="status">Comprobando...</span></header>
<section class="welcome" id="welcome"><h2>¿Qué vamos a <span class="gradient">crear hoy?</span></h2><p>Tu espacio de inteligencia artificial.</p></section>
<section id="messages" aria-live="polite"></section>
<form id="chat"><textarea id="prompt" placeholder="Escribe tu mensaje..." rows="1" required></textarea><button id="send">Enviar</button></form>
<p class="note">NEXUS AI puede usar proveedores externos. No introduzcas datos privados.</p>
</main>
<script>
const form=document.querySelector("#chat"),input=document.querySelector("#prompt"),send=document.querySelector("#send"),messagesEl=document.querySelector("#messages");
let history=[];
function add(text,role){document.querySelector("#welcome").style.display="none";const el=document.createElement("div");el.className="msg "+role;el.textContent=text;messagesEl.append(el);el.scrollIntoView({behavior:"smooth",block:"end"});}
fetch("/api/status").then(r=>r.json()).then(s=>{const ready=s.providers.filter(p=>p.configured);document.querySelector("#status").textContent=ready.length?ready.map(p=>p.name).join(" · ")+" conectado":"Configura una API key";}).catch(()=>document.querySelector("#status").textContent="Servidor no disponible");
form.addEventListener("submit",async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value="";history.push({role:"user",content:text});add(text,"user");send.disabled=true;send.textContent="...";
try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"system",content:"Eres NEXUS AI, un asistente útil, claro y seguro. Responde en español salvo que te pidan otro idioma."},...history]})});const d=await r.json();if(!r.ok)throw new Error(d.error+(d.details?"\n"+d.details:""));history.push({role:"assistant",content:d.reply});add(d.reply+"\n\n— "+d.provider,"assistant");}
catch(err){add("No se pudo completar la respuesta: "+err.message,"assistant");history.pop();}finally{send.disabled=false;send.textContent="Enviar";input.focus();}});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
</script></body></html>
